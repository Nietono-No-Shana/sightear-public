<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>sightear · 视唱练耳</title>
    <style>
      @font-face {
        font-family: 'Bravura';
        src: url('/fonts/Bravura.woff2') format('woff2');
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        --bg: #0e131b;
        --surface: #19202a;
        --surface-2: #1c2634;
        --border: #283446;
        --text: #e8edf4;
        --muted: #8b98a9;
        --accent: #5b8cff;
        --accent-soft: rgba(91, 140, 255, 0.14);
        --ok: #64d78a;
        --bad: #ff8a8a;
        background: var(--bg);
        color: var(--text);
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(900px 420px at 50% -180px, rgba(91, 140, 255, 0.09), transparent 70%),
          var(--bg);
      }
      #app { max-width: 960px; margin: 0 auto; padding: 34px 20px 72px; }
      h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
      .muted { color: var(--muted); font-size: 13px; line-height: 1.6; }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px;
        margin-top: 20px;
      }
      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .brand { display: flex; align-items: baseline; gap: 10px; }
      .brand-sub { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
      .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .spread { justify-content: space-between; }
      .button {
        appearance: none;
        font: inherit;
        border: 1px solid #38475b;
        background: #222c3a;
        color: var(--text);
        border-radius: 9px;
        padding: 9px 14px;
        font-size: 14px;
        cursor: pointer;
        transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
      }
      .button:hover:not(:disabled) { background: #2a3748; border-color: #465a74; }
      .button:active:not(:disabled) { transform: translateY(1px); }
      .button.primary { background: var(--accent); border-color: var(--accent); }
      .button.primary:hover:not(:disabled) { background: #6d98ff; border-color: #6d98ff; }
      .button.ghost { background: transparent; border-color: transparent; color: #b7c3d3; padding: 7px 9px; }
      .button.ghost:hover:not(:disabled) { background: rgba(255, 255, 255, 0.05); border-color: transparent; }
      .button.small { padding: 7px 11px; font-size: 12.5px; }
      .button:disabled { opacity: 0.45; cursor: default; }
      .button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .section-title { font-size: 18px; font-weight: 650; margin: 0 0 8px; }
      .prompt { font-size: 20px; font-weight: 600; margin: 14px 0 16px; }
      .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .option { text-align: left; font-size: 15px; }
      .feedback { min-height: 24px; margin-top: 16px; font-size: 14px; }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .stats { display: flex; gap: 18px; flex-wrap: wrap; color: #b7c3d3; font-size: 13px; }
      .staff { margin: 16px 0; padding: 10px 12px; background: #f5f1e8; border-radius: 10px; }
      .staff-svg { display: block; width: 100%; height: auto; }
      .timbre-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
      .timbre-option { text-align: center; padding: 18px 10px; }
      .timbre-option.selected { border-color: var(--accent); background: #243652; box-shadow: inset 0 0 0 1px var(--accent); }
      .options.course-options .option { padding: 22px 18px; font-size: 18px; text-align: center; }
      .setup-grid { display: grid; grid-template-columns: 0.9fr 1.4fr 0.7fr; gap: 12px; margin-top: 16px; }
      .field { display: flex; flex-direction: column; gap: 6px; }
      select { appearance: none; border: 1px solid #38475b; background: #222c3a; color: var(--text); border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 14px; }
      .debug { margin-top: 12px; color: #667487; font-size: 12px; font-variant-numeric: tabular-nums; }
      .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(9, 12, 17, 0.86); z-index: 10; }
      .overlay-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; max-width: 420px; text-align: center; }
      .hidden { display: none !important; }
      .footer { margin-top: 18px; }
      .home-hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
      .home-copy { max-width: 56ch; }
      .home-title { margin: 0; font-size: clamp(24px, 3.2vw, 30px); font-weight: 650; letter-spacing: -0.01em; }
      .home-lead { margin: 10px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
      .home-card {
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        margin-top: 24px;
        padding: 18px 20px;
        background: linear-gradient(150deg, #1c2a3d 0%, #17202c 100%);
        border: 1px solid #33465e;
        border-radius: 14px;
        color: var(--text);
        text-align: left;
        cursor: pointer;
        transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
      }
      .home-card:hover { transform: translateY(-2px); border-color: var(--accent); background: linear-gradient(150deg, #20314a 0%, #192431 100%); }
      .home-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .home-card-icon { display: grid; place-items: center; flex: 0 0 44px; width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: #a9c2ff; font-size: 20px; }
      .home-card-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .home-card-title { font-size: 16px; font-weight: 650; }
      .home-card-sub { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
      .home-card-arrow { margin-left: auto; color: var(--accent); font-size: 18px; }
      .settings-card { max-width: 760px; }
      .settings-card .section-title { margin-bottom: 18px; }
      .settings-section { padding-top: 18px; margin-top: 18px; border-top: 1px solid var(--border); }
      .settings-section:first-of-type { padding-top: 0; margin-top: 0; border-top: 0; }
      .settings-heading { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
      .settings-label { display: flex; flex-direction: column; gap: 6px; }
      .course-topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
      .course-loading { display: grid; place-items: center; gap: 12px; padding: 72px 20px; color: var(--muted); font-size: 13px; }
      .course-spinner { width: 22px; height: 22px; border: 2px solid #2f3d50; border-top-color: var(--accent); border-radius: 50%; animation: course-spin 800ms linear infinite; }
      @keyframes course-spin { to { transform: rotate(360deg); } }
      @media (max-width: 600px) {
        #app { padding-top: 22px; }
        .setup-grid { grid-template-columns: 1fr; }
        .timbre-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .home-hero { flex-direction: column; gap: 16px; }
      }
      @media (max-width: 480px) {
        .brand-sub { display: none; }
      }
      @media (max-width: 480px) { .options { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
